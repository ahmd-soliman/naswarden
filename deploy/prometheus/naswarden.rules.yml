# Prometheus alerting rules for NasWarden. Load with:
#   rule_files: [naswarden.rules.yml]
# Validate with: promtool check rules deploy/prometheus/naswarden.rules.yml
groups:
  - name: naswarden-self
    rules:
      # naswarden itself lost TrueNAS: no refresh of the core data has
      # succeeded (this is the same condition that turns /healthz into 503).
      - alert: NaswardenRefreshStale
        expr: time() - naswarden_last_refresh_success_timestamp_seconds > 180
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "NasWarden has not refreshed TrueNAS data for {{ $value | humanizeDuration }}"
          description: "Server, pool and dataset data is stale. Check TrueNAS reachability and the API key."

      # An optional source (docker proxy, Incus, VM/alert/replication query)
      # keeps failing; NasWarden is showing its previous snapshot.
      - alert: NaswardenSourceStale
        expr: naswarden_source_stale == 1
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "NasWarden source {{ $labels.source }} is not updating"
          description: "The last refresh of {{ $labels.source }} failed; its cards and metrics show the previous snapshot."

      - alert: NaswardenDown
        expr: up{job=~".*naswarden.*"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "NasWarden is not being scraped"

  - name: naswarden-truenas
    rules:
      - alert: TrueNASCriticalAlert
        expr: naswarden_truenas_alert_count{level=~"CRITICAL|ERROR|ALERT|EMERGENCY"} > 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "{{ $value }} active TrueNAS {{ $labels.level }} alert(s)"

      - alert: TrueNASWarningAlert
        expr: naswarden_truenas_alert_count{level="WARNING"} > 0
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} TrueNAS warning(s) unresolved for over an hour"

      - alert: ZFSPoolDegraded
        expr: naswarden_pool_healthy == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "Pool {{ $labels.pool }} is not healthy"

      - alert: DiskHot
        expr: naswarden_disk_temperature_celsius > 55
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "Disk {{ $labels.disk }} ({{ $labels.pool }}) at {{ $value }}C"

      - alert: DiskVeryHot
        expr: naswarden_disk_temperature_celsius > 60
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Disk {{ $labels.disk }} ({{ $labels.pool }}) at {{ $value }}C"

  - name: naswarden-services
    rules:
      # The series only exists for services that are running, set to start on
      # boot, or have enabled shares, so 0 means "should be running but is
      # stopped". A service switched off on purpose (disabled, no shares) has
      # no series and does not fire.
      - alert: TrueNASServiceDown
        expr: naswarden_service_up == 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "TrueNAS service {{ $labels.service }} is stopped but should be running (start on boot, or it has shares)"

  - name: naswarden-zfs
    rules:
      # ZFS counters since the pool was imported; any increase is a disk
      # worth checking, long before the pool reports DEGRADED.
      - alert: ZFSDiskErrors
        expr: increase(naswarden_disk_errors[1h]) > 0
        labels: {severity: warning}
        annotations:
          summary: "Disk {{ $labels.disk }} ({{ $labels.pool }}) logged {{ $value }} new {{ $labels.type }} error(s) in the last hour"

      - alert: ZFSVdevErrors
        expr: increase(naswarden_vdev_errors[1h]) > 0
        labels: {severity: warning}
        annotations:
          summary: "Vdev {{ $labels.vdev }} ({{ $labels.pool }}) logged {{ $value }} new {{ $labels.type }} error(s) in the last hour"

      - alert: ZFSPoolFragmented
        expr: naswarden_pool_fragmentation_percent > 80
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "Pool {{ $labels.pool }} is {{ $value }}% fragmented"

      # TrueNAS scrubs every 35 days by default. The series only exists while
      # the pool's latest scan is a finished scrub, so a pool that has never
      # been scrubbed does not trigger this.
      - alert: ZFSScrubOverdue
        expr: time() - naswarden_pool_last_scrub_timestamp_seconds > 60 * 86400
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "Pool {{ $labels.pool }} was last scrubbed {{ $value | humanizeDuration }} ago"

  - name: naswarden-replication
    rules:
      - alert: ReplicationFailed
        expr: naswarden_replication_task_status{state=~"ERROR|FAILED|ABORTED"} == 1 or naswarden_replication_task_status{job_state=~"FAILED|ABORTED"} == 1
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Replication task {{ $labels.name }} -> {{ $labels.target_pool }} failed"

      # Nightly tasks: no successful run for over a day plus slack.
      - alert: ReplicationNotSucceeding
        expr: time() - naswarden_replication_last_success_timestamp_seconds > 26 * 3600
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Replication task {{ $labels.name }} has not succeeded for {{ $value | humanizeDuration }}"

  # Snapshot, Cloud Sync, Rsync and TrueCloud backup tasks, counted per kind:
  # /metrics never carries task names, so open NasWarden's Data protection
  # section (or TrueNAS) to see which one.
  - name: naswarden-protection
    rules:
      - alert: ProtectionTaskFailed
        expr: naswarden_protection_tasks{state="FAILED"} > 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "{{ $value }} {{ $labels.kind }} task(s) failed on the last run"
          description: "Open the Data protection section in NasWarden for which task and the error."

      # Last run fine, but a scheduled run since then never happened.
      - alert: ProtectionTaskOverdue
        expr: naswarden_protection_overdue_tasks > 0
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} {{ $labels.kind }} task(s) missed a scheduled run"
          description: "Open the Data protection section in NasWarden for which task."
