name: Build and publish image

on:
  push:
    branches: [main]
  # Lint and tests gate every PR; the image is only built and pushed from main.
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - run: go vet ./...

      - name: Grafana dashboard is valid JSON
        run: jq empty deploy/grafana/*.json

      # Built with the job's own Go toolchain: the prebuilt release binaries
      # refuse a module newer than the Go they were built with.
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          "$(go env GOPATH)/bin/golangci-lint" run ./...

      - run: go test -race ./...

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm test
        working-directory: web
      # `npm run build` typechecks (vue-tsc) and writes internal/web/dist,
      # which is committed so `go build` works without Node. Fail if the
      # committed build is out of date with the sources.
      - run: npm run build
        working-directory: web
      - name: committed dist matches the sources
        run: git diff --exit-code --stat -- internal/web/dist

  build-and-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
